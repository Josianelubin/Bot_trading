services:
  - type: web
    name: kps-web
    runtime: docker
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: KPS_DEBUG
        value: "False"
      - key: KPS_SECRET_KEY
        generateValue: true
      - key: KPS_TRADING_MODE
        value: DEMO
      - key: KPS_ALLOW_LIVE
        value: "false"
      - key: KPS_ADMIN_USERNAME
        sync: false
      - key: KPS_ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kps-db
          property: connectionString
  # Le bot tourne dans un Background Worker (le service web gratuit s'endort).
  # Verifie sur render.com si ce type de service est payant pour ton compte.
  - type: worker
    name: kps-bot
    runtime: docker
    plan: starter
    envVars:
      - key: KPS_ROLE
        value: bot
      - key: KPS_DEBUG
        value: "False"
      - key: KPS_SECRET_KEY
        generateValue: true
      - key: KPS_TRADING_MODE
        value: DEMO
      - key: KPS_ALLOW_LIVE
        value: "false"
      - key: KPS_ADMIN_USERNAME
        sync: false
      - key: KPS_ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kps-db
          property: connectionString
databases:
  - name: kps-db
    plan: free

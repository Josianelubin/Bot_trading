services:
  - type: web
    name: kps-web
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: KPS_DEBUG
        value: "False"
      - key: KPS_SECRET_KEY
        generateValue: true
      - key: KPS_TRADING_MODE
        value: DEMO
      - key: KPS_ALLOW_LIVE
        value: "false"
      - key: KPS_ADMIN_USERNAME
        sync: false
      - key: KPS_ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kps-db
          property: connectionString
  # Le bot tourne dans un Background Worker (le service web gratuit s'endort).
  # Verifie sur render.com si ce type de service est payant pour ton compte.
  - type: worker
    name: kps-bot
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements-prod.txt"
    startCommand: "python manage.py run_bot"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: KPS_DEBUG
        value: "False"
      - key: KPS_SECRET_KEY
        generateValue: true
      - key: KPS_TRADING_MODE
        value: DEMO
      - key: KPS_ALLOW_LIVE
        value: "false"
      - key: KPS_ADMIN_USERNAME
        sync: false
      - key: KPS_ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kps-db
          property: connectionString
databases:
  - name: kps-db
    plan: free
